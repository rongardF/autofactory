  - [-0.001, -0.298, 0.497, 1.467, 1.187, 1.473]
  - [-0.017, 0.010, 0.550, -3.128, 1.441, -3.121]
  - [-0.004, 0.316, 0.505, -1.479, 1.133, -1.490]

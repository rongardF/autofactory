# Sample device-agnostic GPIO controller mapping for a Universal Robots arm.
#
# The device-agnostic envelope (device_type, publish_rate_hz) is validated by
# the node; the opaque `device` block is interpreted by the selected driver
# (here, the UR driver). Every `io_name` must be globally unique across all
# categories and both digital and analog signals.

device_type: ur
publish_rate_hz: 125.0

device:
  # ROS namespace where ur_robot_driver's io_and_status_controller lives.
  controller_namespace: /io_and_status_controller
  service_timeout_sec: 5.0

  # Arbitrary UR mapping: pin <-> io_name, grouped by UR I/O category.
  # Optional per-entry `default` seeds the initial/simulated value.
  mapping:
    digital_in_states:
      - { pin: 3, io_name: tool_presence_sensor, default: false }
      - { pin: 4, io_name: cross_laser_x_triggered, default: false }
      - { pin: 5, io_name: cross_laser_y_triggered, default: false }
    # UR tool voltage is a single settable output (0/12/24 V) -> AnalogIO/voltage.
    tool_voltage:
      - { io_name: tool_supply_voltage }

# Production runtime only. Development uses .devcontainer/compose.yaml.
# Supply a prebuilt workstation:prod image containing the compiled workspace
# and its production command; docker/Dockerfile currently builds a dev image.
# Usage: WORKSTATION_ID=station-01 docker compose up -d

services:
  workstation-prod:
    image: workstation:prod
    network_mode: host
    user: "1000:1000" # Matches the default ros account in the image.
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RCUTILS_LOGGING_USE_STDOUT: "0"
      WORKSTATION_ID: ${WORKSTATION_ID:?Set WORKSTATION_ID for production}
      APP_PROFILE: prod
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    restart: unless-stopped
